<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Scroll lab</title>
    <link rel="stylesheet" href="parallax.css">
</head>
<body>
    <!-- Lapisan Parallax 1 -->
    <section class="parallax-bg bg-1">
        <div class="caption">
            <h1>Paralex Scroll</h1>
            <p>Scroll ke bawa dan perhatikan pergerakan backgroundnya</p>
        </div>
    </section>

    <!-- Lapisan Konten Biasa (Pemisah) -->
    <section class="content-block">
        <h2>Konten Solid di Tengah</h2>
        <p>Bagian ini bergerak Normal Mengikuti Scroll, sementara gmbar di atas dan di bawa terasa dia di balik layar</p>
    </section>

    <section class="parallax-bg bg-2">
        <div class="caption">
            <h2>Kedalaman Visual</h2>
            <p>Ini efek <code>background-attachment: fixed</code> di CSS.</p>
        </div>
    </section>
</body>
</html>
